[project]
name = "decillion-caspar-bridge"
dynamic = ["version"]
description = "Runs a Decillion project's agents as a CrewAI crew inside its Modal sandbox, connected to the Caspar node over the gateway subscription channel."
readme = "README.md"
requires-python = ">=3.10, <3.14"
dependencies = [
    "crewai",
    "websockets>=13,<16",
]

[project.scripts]
decillion-caspar-bridge = "decillion_caspar_bridge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/decillion_caspar_bridge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/decillion_caspar_bridge"]

[project]
name = "decillion-tool-server"
dynamic = ["version"]
description = "Exposes a Decillion project's sandbox tools to its Caspar-hosted agents over the gateway subscription channel."
readme = "README.md"
requires-python = ">=3.10, <3.14"
dependencies = [
    # The agents run on Caspar.  Pulling the whole agent framework into the
    # bridge's critical path made five local file tools take minutes to become
    # ready; they need only schemas and the gateway client.
    "pydantic>=2,<3",
    "websockets>=13,<16",
]

[project.scripts]
decillion-tool-server = "decillion_tool_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/decillion_tool_server/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/decillion_tool_server"]

[tool.pytest.ini_options]
# `pythonpath` rather than an editable install on purpose. The package declares
# `crewai`, which pins the interpreter, so `pip install -e .` refuses on a host
# whose Python is outside that range — while the bridge's own modules import
# crewai lazily and its tests never need it. Making the suite runnable was
# otherwise a matter of guessing two pytest flags, which is why it was reported
# as "not runnable on this host".
#
# Naming a config file here also fixes pytest's rootdir at this package, so
# collection stops looking for conftest.py in the crewAI workspace above (whose
# own conftest imports test dependencies this package does not have).
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
